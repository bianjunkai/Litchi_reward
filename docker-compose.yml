x-build-proxy: &build-proxy
  HTTP_PROXY: ${BUILD_PROXY:-}
  HTTPS_PROXY: ${BUILD_PROXY:-}
  NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,api,web}
  http_proxy: ${BUILD_PROXY:-}
  https_proxy: ${BUILD_PROXY:-}
  no_proxy: ${BUILD_NO_PROXY:-localhost,127.0.0.1,api,web}

services:
  api:
    build:
      context: ./backend
      args: *build-proxy
    environment:
      DB_PATH: /app/data/rewards.db
      PARENT_PIN: ${PARENT_PIN:-}
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args: *build-proxy
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-18736}:80"
    restart: unless-stopped
